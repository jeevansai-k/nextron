[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nextron"
version = "1.0.0"
description = "Intelligent Tor Switcher with VPN & Ad Blocking in CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeevan Sai K", email = "kukkalajeevansai@gmail.com" }]
maintainers = [{ name = "Jeevan Sai K", email = "kukkalajeevansai@gmail.com" }]
keywords = [
    "tor", "vpn", "wireguard", "openvpn", "privacy", "anonymity",
    "dns", "adblock", "tui", "textual", "cli", "linux",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "pillow>=10.0",
    "stem>=1.8.2",
    "psutil>=5.9",
    "httpx[socks]>=0.27",
    "dnslib>=0.9.24",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/jeevansai-k"
Repository = "https://github.com/jeevansai-k/nextron"
Issues = "https://github.com/jeevansai-k/nextron/issues"

[project.scripts]
nextron = "nextron.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["nextron"]

# The official banner ships inside the package so an installed NEXTRON can
# still render it; the repository keeps assets/ as the editable source.
[tool.hatch.build.targets.wheel.force-include]
"assets" = "nextron/_assets"

[tool.hatch.build.targets.sdist]
include = [
    "/nextron",
    "/assets",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # typer uses function calls in argument defaults by design
    "SIM105",  # contextlib.suppress is not always clearer than try/except
    "UP042",   # (str, Enum) keeps explicit .value semantics that StrEnum changes
    "RUF001",  # the interface deliberately uses glyphs such as ★ ● → ✔
    "RUF002",  # ... including inside docstrings
    "RUF003",  # ... and inside comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Textual's own API is declarative class state: BINDINGS/CSS_PATH are lists by
# design, so RUF012 (mutable class default) does not apply to widgets.
"nextron/tui/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["nextron"]
